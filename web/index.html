<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habla con los guardianes</title>
<style>
  :root { --bg:#0e0f13; --panel:#171922; --line:#262a38; --txt:#e7e9f0; --dim:#9aa0b4; --acc:#5B8BF0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; color:var(--dim); letter-spacing:.5px; }
  #selector { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:7px 14px; border:1px solid var(--line); border-radius:20px; background:var(--panel);
          color:var(--txt); cursor:pointer; font-size:13px; transition:all .15s; }
  .chip:hover { border-color:var(--acc); }
  .chip.sel { color:#fff; border-color:transparent; }
  /* --- Escena: chat y rayos X en dos columnas -------------------------- */
  /* Cuatro vistas, en el atributo data-vista de #escena:
       solo   sin rayos X: el chat ocupa todo y sin cabeceras (modo sala)
       ambos  las dos columnas al 50 %
       chat   el chat ampliado a pantalla completa
       xray   los rayos X ampliados a pantalla completa                    */
  #escena { flex:1; display:flex; min-height:0; }
  .col { flex:1 1 50%; display:flex; flex-direction:column; min-width:0; min-height:0; }
  #col-xray { display:none; border-left:1px solid var(--line); }
  #escena[data-vista="ambos"] #col-xray,
  #escena[data-vista="xray"]  #col-xray { display:flex; }
  #escena[data-vista="xray"]  #col-chat { display:none; }
  #escena[data-vista="solo"]  #col-chat > .cab { display:none; }
  /* cabecera de cada columna, con su botón de ampliar */
  .cab { display:flex; align-items:center; gap:8px; padding:7px 14px; flex:none;
         border-bottom:1px solid var(--line); background:var(--panel);
         font-size:11px; color:var(--dim); letter-spacing:.6px; text-transform:uppercase; }
  .cab button { margin-left:auto; padding:2px 9px; border-radius:6px; cursor:pointer;
                border:1px solid var(--line); background:transparent; color:var(--dim); font-size:13px; }
  .cab button:hover { border-color:var(--acc); color:var(--txt); }

  #chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; }
  #xray-cont { flex:1; overflow-y:auto; padding:16px; }
  /* en columna propia el panel ya no compite con las burbujas: que ocupe todo */
  #xray-cont .xray { max-width:none; }
  .vacio { color:var(--dim); font-style:italic; font-size:13px; line-height:1.5;
           text-align:center; padding:40px 20px; }
  /* de qué turno habla el panel */
  .turno { font-size:12px; color:var(--dim); margin-bottom:10px; padding-left:2px; }
  .turno b { color:var(--txt); font-weight:500; }
  /* En pantalla estrecha, dos columnas al 50 % no se leen: se apilan. */
  @media (max-width:900px) {
    #escena { flex-direction:column; }
    #col-xray { border-left:none; border-top:1px solid var(--line); }
  }
  .msg { max-width:680px; padding:12px 16px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--acc); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bot.pending::after { content:'▍'; animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #saludo { align-self:center; color:var(--dim); font-style:italic; font-size:14px; max-width:600px; text-align:center; }
  footer { padding:16px 20px; border-top:1px solid var(--line); display:flex; gap:10px; }
  #entrada { flex:1; padding:12px 16px; border-radius:24px; border:1px solid var(--line);
             background:var(--panel); color:var(--txt); font-size:15px; outline:none; }
  #entrada:focus { border-color:var(--acc); }
  #enviar { padding:0 22px; border-radius:24px; border:none; background:var(--acc); color:#fff;
            font-size:15px; cursor:pointer; }
  #enviar:disabled { opacity:.4; cursor:default; }
  /* Parar: solo existe mientras el personaje genera o habla. */
  #parar { padding:0 20px; border-radius:24px; border:1px solid #c0392b;
           background:transparent; color:#e8756a; font-size:14px; cursor:pointer; }
  #parar:hover { background:#c0392b; color:#fff; }
  #parar[hidden] { display:none; }
  /* respuesta cortada a media frase */
  .bot.cortado::after { content:' ⏹'; color:#e8756a; font-size:12px; }
  /* el poema al transeúnte: no es una respuesta, es la obra llamando */
  .bot.poema { font-style:italic; border-style:dashed; border-color:var(--acc);
               background:transparent; }
  /* micrófono: hablarle al personaje en vez de escribirle */
  #mic { flex:none; width:46px; border-radius:50%; border:1px solid var(--line);
         background:var(--panel); color:var(--dim); font-size:17px; cursor:pointer; }
  #mic:hover:not(:disabled) { border-color:var(--acc); color:var(--txt); }
  #mic:disabled { opacity:.4; cursor:default; }
  #mic.oyendo { background:#c0392b; border-color:#c0392b; color:#fff;
                animation:pulso 1.3s ease-out infinite; }
  @keyframes pulso { 0% { box-shadow:0 0 0 0 rgba(192,57,43,.5); }
                     100% { box-shadow:0 0 0 12px rgba(192,57,43,0); } }

  /* --- Modo rayos X: enseñar CÓMO se construyó cada respuesta ------------ */
  #xray-btn { margin-left:auto; padding:6px 12px; border-radius:20px; font-size:12px;
              border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer; }
  /* Activo = fondo lleno, igual que el chip del personaje seleccionado. El
     cambio sutil de antes era invisible sobre el fondo oscuro y parecía que
     el botón no respondía. */
  #xray-btn.on { color:#fff; border-color:transparent; background:var(--acc); }
  .xray { align-self:flex-start; max-width:680px; width:100%; font-size:12.5px;
          border:1px solid var(--line); border-left:2px solid var(--acc);
          border-radius:10px; background:#12141c; color:var(--dim); }
  .xray > .cap { border-top:1px solid var(--line); }
  .xray > .cap:first-child { border-top:none; }
  .xray summary { padding:9px 14px; cursor:pointer; color:var(--txt); list-style:none;
                  display:flex; align-items:baseline; gap:8px; }
  .xray summary::-webkit-details-marker { display:none; }
  .xray summary::before { content:'▸'; color:var(--acc); font-size:10px; }
  .xray details[open] > summary::before { content:'▾'; }
  .xray .n { color:var(--acc); font-variant-numeric:tabular-nums; }
  .xray .tag { margin-left:auto; font-size:11px; color:var(--dim); }
  .xray .cuerpo { padding:2px 14px 14px 26px; display:flex; flex-direction:column; gap:9px; }
  .xray .nota { font-style:italic; line-height:1.45; opacity:.85; }
  .xray .aviso { color:#e8b04b; font-style:italic; line-height:1.45; }
  .xray code, .xray pre { font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
  .xray pre { margin:0; padding:9px 11px; background:#0b0c11; border:1px solid var(--line);
              border-radius:7px; white-space:pre-wrap; color:var(--txt);
              max-height:220px; overflow:auto; }
  .xray .diales { color:var(--txt); }
  /* un fragmento recuperado, con su distancia */
  .frag { border:1px solid var(--line); border-radius:7px; padding:8px 10px; background:#0b0c11; }
  .frag.no { opacity:.5; }
  .frag .cab { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .frag .sello { font-size:10.5px; padding:1px 7px; border-radius:10px; border:1px solid; }
  .frag.si .sello { color:#5ec98a; border-color:#2e6b47; }
  .frag.no .sello { color:var(--dim); border-color:var(--line); }
  .frag .dist { font-family:ui-monospace,Consolas,monospace; color:var(--txt); }
  .frag .fuente { margin-left:auto; font-size:11px; }
  .frag .txt { color:var(--txt); line-height:1.45; max-height:64px; overflow:hidden; }
  /* regla de distancia: 0 (idéntico) → 1 (nada que ver), con el umbral marcado */
  .regla { position:relative; height:4px; background:var(--line); border-radius:2px; margin:7px 0 6px; }
  .regla .yo { position:absolute; top:0; height:4px; border-radius:2px; background:#5ec98a; }
  .frag.no .regla .yo { background:#4a4f63; }
  .regla .umb { position:absolute; top:-3px; width:1px; height:10px; background:#e8b04b; }
  .rol { color:var(--acc); text-transform:uppercase; font-size:10.5px; letter-spacing:.6px; }

  /* --- Presencia: la obra mira de vuelta --------------------------------- */
  #ojo { padding:6px 12px; border-radius:20px; font-size:12px; border:1px solid var(--line);
         background:var(--panel); color:var(--dim); cursor:pointer; }
  #ojo.on { color:#fff; border-color:var(--acc); background:transparent; }
  #presencia { position:fixed; right:16px; bottom:84px; width:168px; z-index:5;
               border:1px solid var(--line); border-radius:10px; overflow:hidden;
               background:#000; display:none; }
  #presencia.viendo { display:block; }
  /* Con la columna de rayos X abierta, el visor se cambia de lado: si no,
     tapa justo la esquina donde acaban de aparecer las capas. */
  #escena[data-vista="ambos"] ~ #presencia,
  #escena[data-vista="xray"]  ~ #presencia { left:16px; right:auto; }
  #presencia.cerca { border-color:var(--acc); }
  /* El vídeo NO se enseña. En la sala, una pantalla que te devuelve tu propia
     cara se lleva la atención que era para la obra, y además da a entender que
     algo te está grabando — justo lo contrario de lo que pasa.
     Se deja de 1 píxel y transparente en vez de display:none A PROPÓSITO: el
     análisis LEE los fotogramas de este elemento, y un vídeo que el navegador
     no pinta puede dejar de entregarlos. La obra se quedaría ciega sin avisar.
     Con ?video=1 vuelve a verse, que el día del montaje hay que encuadrar. */
  #cam { position:absolute; top:0; left:0; width:1px; height:1px;
         opacity:0; pointer-events:none; }
  #presencia.convideo #cam { position:static; width:100%; height:auto;
                             opacity:.75; transform:scaleX(-1); }
  #pstat { padding:5px 8px; font-size:10.5px; color:var(--dim); background:var(--panel);
           font-family:ui-monospace,Consolas,monospace; white-space:pre-line; line-height:1.4; }
  #presencia.cerca #pstat { color:var(--txt); }
  /* la invitación: aparece cuando alguien se acerca */
  #invita { position:fixed; left:50%; top:76px; transform:translateX(-50%) translateY(-8px);
            z-index:6; padding:11px 22px; border-radius:24px; font-size:14px;
            background:var(--acc); color:#fff; box-shadow:0 6px 24px rgba(0,0,0,.45);
            opacity:0; pointer-events:none; transition:opacity .45s, transform .45s; }
  #invita.ver { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <h1>GUARDIANES</h1>
    <div id="selector"></div>
    <button id="xray-btn" title="Muestra cómo se construyó cada respuesta">🔬 Rayos X</button>
    <button id="ojo" title="La webcam detecta quién se acerca y hacia dónde mira">👁 Presencia</button>
  </header>
  <main id="escena" data-vista="solo">
    <section id="col-chat" class="col">
      <div class="cab">Conversación
        <button data-col="chat" title="Ampliar a pantalla completa">⤢</button>
      </div>
      <div id="chat"><div id="saludo">Elige un guardián para empezar.</div></div>
    </section>
    <section id="col-xray" class="col">
      <div class="cab">🔬 Rayos X — cómo se construyó
        <button data-col="xray" title="Ampliar a pantalla completa">⤢</button>
      </div>
      <div id="xray-cont"></div>
    </section>
  </main>
  <div id="invita"></div>
  <div id="presencia"><video id="cam" playsinline muted></video><div id="pstat"></div></div>
  <footer>
    <input id="entrada" placeholder="Escribe tu mensaje… o pulsa el micrófono" autocomplete="off" disabled>
    <button id="mic" title="Habla en vez de escribir" disabled>🎤</button>
    <button id="enviar" disabled>Enviar</button>
    <button id="parar" title="Corta la respuesta (o di «para»)" hidden>⏹ Parar</button>
  </footer>

<script>
const $chat = document.getElementById('chat');
const $sel = document.getElementById('selector');
const $inp = document.getElementById('entrada');
const $btn = document.getElementById('enviar');
const $mic = document.getElementById('mic');
const $parar = document.getElementById('parar');
const $escena = document.getElementById('escena');
const $xcont = document.getElementById('xray-cont');
let generando = false;   // el personaje está redactando su respuesta

// Abre o cierra los tres controles a la vez (se bloquean mientras responde).
function controles(activos) {
  $inp.disabled = $btn.disabled = $mic.disabled = !activos;
}

let personajes = [];
let actual = null;
let historial = [];

// Cargar los personajes activos del backend
fetch('/api/personajes').then(r => r.json()).then(ps => {
  personajes = ps;
  ps.forEach(p => {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = p.nombre; c.dataset.id = p.id;
    c.onclick = () => elegir(p);
    $sel.appendChild(c);
  });
  if (ps.length) elegir(ps[0]);
});

// 'discreto': cambia de personaje sin anunciarlo. Lo usa el giro de cabeza —
// ahí el visitante ya está conversando y una bienvenida solo estorba.
function elegir(p, discreto) {
  actual = p; historial = [];
  document.documentElement.style.setProperty('--acc', p.color || '#5B8BF0');
  [...$sel.children].forEach(c => {
    const on = c.dataset.id === p.id;
    c.classList.toggle('sel', on);
    c.style.background = on ? (p.color || '#5B8BF0') : '';
  });
  // El historial SÍ se vacía siempre: el turno anterior era de otro personaje
  // y mandárselo a este le metería en la boca palabras que no son suyas.
  $chat.innerHTML = discreto ? '' : `<div id="saludo">${p.saludo || ''}</div>`;
  controles(true); $inp.focus();
}

function burbuja(clase, texto='') {
  const d = document.createElement('div');
  d.className = 'msg ' + clase; d.textContent = texto;
  $chat.appendChild(d); $chat.scrollTop = $chat.scrollHeight;
  return d;
}

async function enviar() {
  const texto = $inp.value.trim();
  if (!texto || !actual) return;
  $inp.value = ''; controles(false); generando = true;
  burbuja('user', texto);
  const bot = burbuja('bot pending');
  let acumulado = '', panel = null, cerrado = false, cortado = false;

  // Abortar el fetch cierra la conexión, el backend ve que el cliente se fue y
  // deja de pedirle tokens a vLLM. Parar de verdad, no solo dejar de mostrar.
  const ctrl = new AbortController();
  pararTurno = () => { cortado = true; ctrl.abort(); terminar(); };
  modoParar(true);

  // Se llama en cuanto el personaje calla. En rayos X el stream sigue abierto
  // un poco más (destilando el recuerdo), pero la interfaz ya se libera.
  function terminar() {
    if (cerrado) return;
    cerrado = true; generando = false; pararTurno = null;
    bot.classList.remove('pending');
    if (cortado) bot.classList.add('cortado');
    historial.push({ role:'user', content: texto });
    historial.push({ role:'assistant', content: acumulado });
    controles(true); $inp.focus();
    // Voz: síntesis del NAVEGADOR (Web Speech API). Instantánea, gratis, local.
    // Si lo cortaron, no se lee en alto lo que ya no se quería oír.
    if (!cortado && acumulado.trim()) hablar(acumulado);
    else modoParar(false);
  }

  try {
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      signal: ctrl.signal,
      body: JSON.stringify({ personaje: actual.id, mensaje: texto, historial, rayosx: xray })
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lineas = buf.split('\n\n'); buf = lineas.pop();
      for (const l of lineas) {
        if (!l.startsWith('data: ')) continue;
        const d = l.slice(6);
        if (d === '[DONE]') continue;
        let ev; try { ev = JSON.parse(d); } catch { continue; }
        if (ev.t !== undefined) {
          acumulado += ev.t; bot.textContent = acumulado;
        } else if (ev.rayosx) {
          // Llega ANTES del primer token: cuando el personaje empieza a hablar,
          // la columna de al lado ya enseña con qué se construyó la respuesta.
          panel = panelRayosX(ev.rayosx, texto);
          $xcont.replaceChildren(panel);   // solo el último turno: cinco capas
          $xcont.scrollTop = 0;            // por turno no se pueden apilar
        } else if (ev.fin) {
          terminar();
        } else if (ev.memoria && panel) {
          memoriaRayosX(panel, ev.memoria);
        }
        $chat.scrollTop = $chat.scrollHeight;
      }
    }
  } catch (e) {
    // AbortError no es un fallo: es que alguien dijo «para».
    if (e.name !== 'AbortError') {
      bot.textContent = '[La señal se perdió. Revisa que el backend y vLLM estén activos.]';
    }
  }
  terminar();
}

// --- EL RECLAMO: un poema a quien pasa de lejos --------------------------
// No es una conversación: es la obra hablándole al aire cuando alguien aparece
// en el encuadre. Por eso no toca el historial, no abre el micrófono y pide al
// backend que NO lo archive (recordar:false): guardarlo llenaría la memoria de
// encuentros que en realidad no ocurrieron.
const PROMPT_POEMA =
  'Alguien acaba de aparecer a lo lejos y todavía no se ha acercado. Recítale '
  + 'un poema muy breve, de tres o cuatro versos, para atraerlo hacia ti. '
  + 'Escríbelo en tu voz. Solo el poema: sin saludos ni explicaciones.';

let recitando = false;

async function recitar() {
  if (recitando || generando || !personajes.length) return false;
  const p = personajes[Math.floor(Math.random() * personajes.length)];
  recitando = true;
  elegir(p, true);                     // discreto: sin saludo ni bienvenida
  const bot = burbuja('bot poema pending');
  let texto = '';
  const ctrl = new AbortController();
  pararTurno = () => { ctrl.abort(); };
  modoParar(true);                     // se puede cortar con «para», como todo
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      signal: ctrl.signal,
      body: JSON.stringify({ personaje: p.id, mensaje: PROMPT_POEMA,
                             historial: [], rayosx: false, recordar: false })
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lineas = buf.split('\n\n'); buf = lineas.pop();
      for (const l of lineas) {
        if (!l.startsWith('data: ')) continue;
        const d = l.slice(6);
        if (d === '[DONE]') continue;
        let ev; try { ev = JSON.parse(d); } catch { continue; }
        if (ev.t !== undefined) { texto += ev.t; bot.textContent = texto; }
      }
      $chat.scrollTop = $chat.scrollHeight;
    }
  } catch (e) { /* abortado o sin red: el poema simplemente no llega */ }
  bot.classList.remove('pending');
  pararTurno = null;
  recitando = false;
  if (texto.trim()) hablar(texto); else { bot.remove(); modoParar(false); }
  return true;
}

// --- MODO RAYOS X --------------------------------------------------------
// Abre la caja negra: por cada turno enseña las capas que produjeron la
// respuesta. Apagado por defecto — en una sala, el público ve al personaje.
let xray = false;
const $xbtn = document.getElementById('xray-btn');
$xbtn.onclick = () => {
  xray = !xray;
  $xbtn.classList.toggle('on', xray);
  $xbtn.textContent = xray ? '🔬 Rayos X activo' : '🔬 Rayos X';
  vista(xray ? 'ambos' : 'solo');
  if (xray && !$xcont.children.length) {
    // El panel se arma con los datos de un turno, así que hasta el próximo
    // mensaje no hay nada que enseñar. Decirlo evita que parezca averiado.
    $xcont.appendChild(el('div', 'vacio',
      'Manda un mensaje y aquí verás, capa por capa, cómo se construyó la respuesta.'));
  }
};

// --- Las dos columnas: 50/50 o una a pantalla completa -------------------
function vista(v) {
  $escena.dataset.vista = v;
  document.querySelectorAll('.cab button').forEach(b => {
    const grande = $escena.dataset.vista === b.dataset.col;
    b.textContent = grande ? '⤡' : '⤢';
    b.title = grande ? 'Volver a media pantalla' : 'Ampliar a pantalla completa';
  });
}

document.querySelectorAll('.cab button').forEach(b => {
  b.onclick = () => {
    // Segundo toque en el que ya está ampliado: se vuelve al reparto 50/50.
    vista($escena.dataset.vista === b.dataset.col ? 'ambos' : b.dataset.col);
  };
});

function el(tag, cls, txt) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (txt !== undefined) d.textContent = txt;
  return d;
}

// Una capa plegable del panel. Devuelve el <details> con .cuerpo dentro.
function capa(n, titulo, etiqueta, abierta) {
  const det = el('details', 'cap');
  det.open = !!abierta;
  const sum = el('summary');
  sum.appendChild(el('span', 'n', n));
  sum.appendChild(el('span', null, titulo));
  sum.appendChild(el('span', 'tag', etiqueta || ''));
  det.appendChild(sum);
  det.cuerpo = el('div', 'cuerpo');
  det.appendChild(det.cuerpo);
  return det;
}

// Un fragmento recuperado, con su distancia dibujada contra el umbral.
function fragmento(f, umbral) {
  const d = el('div', 'frag ' + (f.pasa ? 'si' : 'no'));
  const cab = el('div', 'cab');
  cab.appendChild(el('span', 'sello', f.pasa ? 'PASA' : 'descartado'));
  cab.appendChild(el('span', 'dist', 'dist ' + f.dist.toFixed(3)));
  cab.appendChild(el('span', 'fuente', f.origen === 'vivido' ? '✨ lo vivido' : f.fuente));
  d.appendChild(cab);
  const regla = el('div', 'regla');
  const yo = el('div', 'yo');   yo.style.width = Math.min(100, f.dist * 100) + '%';
  const umb = el('div', 'umb'); umb.style.left  = (umbral * 100) + '%';
  regla.appendChild(yo); regla.appendChild(umb);
  d.appendChild(regla);
  d.appendChild(el('div', 'txt', f.texto));
  return d;
}

// Devuelve un bloque con la pregunta del turno + las cinco capas. Es un <div>
// de verdad, no un fragment: memoriaRayosX() lo consulta DESPUÉS de insertarlo
// para rellenar la capa ⑤, y un fragment se vacía al añadirlo al DOM.
function panelRayosX(x, pregunta) {
  const caja = el('div');
  if (pregunta) {
    const t = el('div', 'turno', 'Turno: ');
    t.appendChild(el('b', null, '“' + pregunta + '”'));
    caja.appendChild(t);
  }
  const p = el('div', 'xray');

  // ① IDENTIDAD — un cerebro, varias voces
  const c1 = capa('①', 'Identidad — quién habla', x.personaje.lora);
  c1.cuerpo.appendChild(el('div', 'diales', 'cerebro (modelo base): ' + x.personaje.base));
  c1.cuerpo.appendChild(el('div', 'diales', 'voz entrenada (LoRA): ' + x.personaje.lora));
  c1.cuerpo.appendChild(el('div', 'nota',
    'Los personajes comparten el MISMO modelo base. Lo único que los separa es el '
    + 'adaptador de voz que se le enchufa, y este texto de identidad:'));
  const sp = el('details');
  sp.appendChild(el('summary', null, 'system prompt · ' + x.system_prompt.length + ' caracteres'));
  const spc = el('div', 'cuerpo');
  spc.appendChild(el('pre', null, x.system_prompt || '(vacío)'));
  sp.appendChild(spc);
  c1.cuerpo.appendChild(sp);
  p.appendChild(c1);

  // ② RECUERDO — el RAG, con sus números a la vista
  const frs = x.rag.fragmentos, n = x.rag.inyectados;
  const c2 = capa('②', 'Recuerdo — qué buscó en su memoria',
                  n + ' de ' + frs.length + ' pasan', true);
  c2.cuerpo.appendChild(el('div', 'nota',
    'Tu mensaje se convierte en un vector y se compara con los textos de su mundo. '
    + 'La distancia va de 0 (idéntico) a 1 (no tiene nada que ver). Solo los que '
    + 'quedan por debajo del umbral (la marca amarilla) entran en el prompt.'));
  c2.cuerpo.appendChild(el('div', 'diales',
    'umbral ' + x.rag.umbral + ' · margen ' + x.rag.margen + ' · k ' + x.rag.k));
  if (!frs.length) {
    c2.cuerpo.appendChild(el('div', 'aviso',
      'No se consultó nada: su memoria está vacía o sin indexar (tools/ingest.py).'));
  }
  frs.forEach(f => c2.cuerpo.appendChild(fragmento(f, x.rag.umbral)));
  if (frs.length && !n) {
    c2.cuerpo.appendChild(el('div', 'aviso',
      'Ningún fragmento superó el filtro: NO se inyectó memoria. Lo que diga sale '
      + 'solo de su carácter y de su entrenamiento — y es justo aquí donde un '
      + 'personaje se inventa las cosas con total aplomo.'));
  }
  p.appendChild(c2);

  // ③ EL PROMPT — el texto literal, sin misterio
  const total = x.prompt.reduce((s, m) => s + m.content.length, 0);
  const c3 = capa('③', 'El prompt — lo que de verdad recibió', total + ' caracteres');
  c3.cuerpo.appendChild(el('div', 'nota',
    'El modelo no "ve" la conversación ni te conoce: recibe esta cadena de texto y '
    + 'la continúa. Todo lo anterior existe solo para escribirla.'));
  x.prompt.forEach(m => {
    const bloque = el('div');
    bloque.appendChild(el('div', 'rol', m.role));
    bloque.appendChild(el('pre', null, m.content));
    c3.cuerpo.appendChild(bloque);
  });
  p.appendChild(c3);

  // ④ EL DADO — por qué nunca responde dos veces igual
  const c4 = capa('④', 'El dado — cómo elige cada palabra',
                  'temp ' + x.muestreo.temperature);
  c4.cuerpo.appendChild(el('div', 'diales',
    'temperature ' + x.muestreo.temperature + ' · top_p ' + x.muestreo.top_p
    + ' · máximo ' + x.muestreo.max_tokens + ' tokens'));
  c4.cuerpo.appendChild(el('div', 'nota',
    'Palabra a palabra, el modelo calcula la probabilidad de todas las que podrían '
    + 'seguir y SORTEA una. No escribe la más probable: la elige al azar entre las '
    + 'buenas. temperature regula cuánto azar (0 = siempre la más probable, >1 = '
    + 'temerario) y top_p limita el sorteo a las candidatas que suman esa '
    + 'probabilidad. Por eso la misma pregunta nunca da dos veces la misma respuesta.'));
  p.appendChild(c4);

  // ⑤ MEMORIA — se rellena al final del turno
  const c5 = capa('⑤', 'Memoria — qué se queda del encuentro', 'destilando…');
  c5.dataset.capa = 'memoria';
  c5.cuerpo.appendChild(el('div', 'nota',
    'Cuando termina de hablar, otra llamada al modelo resume el encuentro en una '
    + 'frase y decide si merece recordarse. Lo que se guarde podrá aparecer en la '
    + 'capa ② de conversaciones futuras — con otros visitantes.'));
  p.appendChild(c5);

  caja.appendChild(p);
  return caja;
}

// Rellena la capa ⑤ cuando llega el veredicto de la memoria.
function memoriaRayosX(panel, m) {
  const c = panel.querySelector('[data-capa="memoria"]');
  if (!c) return;
  const dic = {
    guardado:  ['recuerdo guardado', '✨ Guardado como recuerdo recuperable:'],
    trivial:   ['descartado', 'El modelo lo juzgó trivial (un saludo, una prueba): '
                + 'no se guarda como recuerdo. El intercambio crudo sí queda archivado.'],
    duplicado: ['duplicado', 'Ya había un recuerdo casi idéntico guardado: no se duplica.'],
    error:     ['sin destilar', 'No se pudo destilar el recuerdo. El intercambio crudo '
                + 'sí queda archivado.'],
  };
  const v = dic[m.estado] || dic.error;
  c.querySelector('.tag').textContent = v[0];
  c.cuerpo.appendChild(el('div', 'diales',
    (m.archivado ? '✓' : '✕') + ' intercambio crudo → vector_store/archivo.db'));
  c.cuerpo.appendChild(el('div', m.estado === 'guardado' ? 'diales' : 'aviso', v[1]));
  if (m.recuerdo) c.cuerpo.appendChild(el('pre', null, m.recuerdo));
}

// Elige una voz en español del navegador (varía según el sistema).
function vozEspanol() {
  const vs = speechSynthesis.getVoices();
  return vs.find(v => /^es(-|_|$)/i.test(v.lang)) || vs[0] || null;
}
// Algunos navegadores cargan las voces de forma asíncrona.
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

// --- LA VOZ ---------------------------------------------------------------
// Dos motores. El bueno es el del POD: Piper + la cadena de efectos, que es la
// única forma de que suene a máquina que transmite desde otro sitio — la voz
// del navegador NO se puede procesar (va directa a la tarjeta de sonido, no
// hay nodo de audio que interceptar). El del navegador queda de red: si el pod
// no tiene piper instalado, la obra habla plano pero habla.
let vozServidor = null;   // null = aún no se sabe; true/false = ya se preguntó
let vozActual = null;     // locución del navegador en curso
let vozAudio = null;      // <audio> del pod en curso
let vozAbort = null;      // para cortar la cola de frases a media respuesta
let vozSonando = false;

fetch('/api/voz/estado').then(r => r.json())
  .then(e => { vozServidor = !!e.disponible;
               if (!e.disponible) console.info('Voz del pod no disponible:', e.motivo); })
  .catch(() => { vozServidor = false; });

/** Parte en frases y junta las muy cortas.
 *
 * Se sintetiza frase a frase para que la primera empiece a sonar mientras el
 * pod prepara la siguiente. Sin esto habría que esperar a procesar la respuesta
 * entera, que con un 8B es una eternidad delante de una obra.
 * Las frases sueltas de dos palabras se agrupan: mandarlas solas al TTS suena
 * entrecortado.
 */
function partirFrases(texto, minimo = 30) {
  const trozos = texto.replace(/\s+/g, ' ').trim().split(/(?<=[.!?…:])\s+/);
  const frases = [];
  for (const t of trozos) {
    if (frases.length && frases[frases.length - 1].length < minimo) frases[frases.length - 1] += ' ' + t;
    else frases.push(t);
  }
  return frases.filter(f => /[a-zA-ZÀ-ÿ0-9]/.test(f));
}

async function hablar(texto) {
  callar();
  if (vozServidor === null) {          // aún no llegó el estado: se espera poco
    for (let i = 0; i < 20 && vozServidor === null; i++) await new Promise(r => setTimeout(r, 100));
  }
  if (!vozServidor) return hablarNavegador(texto);

  const frases = partirFrases(texto);
  if (!frases.length) return modoParar(false);
  const ctrl = new AbortController();
  vozAbort = ctrl;
  vozSonando = true;
  try {
    // Se pide la frase siguiente MIENTRAS suena la actual: el pod sintetiza en
    // paralelo a la reproducción y no se nota la costura.
    let pedido = pedirVoz(frases[0], true, ctrl.signal);
    for (let i = 0; i < frases.length; i++) {
      const blob = await pedido;
      if (ctrl.signal.aborted) return;
      pedido = i + 1 < frases.length ? pedirVoz(frases[i + 1], false, ctrl.signal) : null;
      await sonar(blob, ctrl.signal);
    }
  } catch (e) {
    if (e.name === 'AbortError') return;          // lo cortaron: normal
    vozServidor = false;                          // el pod falló: a la red
    console.warn('Voz del pod caída, sigo con la del navegador:', e.message);
    return hablarNavegador(texto);
  } finally {
    vozSonando = false;
    if (vozAbort === ctrl) { vozAbort = null; if (!ctrl.signal.aborted) modoParar(false); }
  }
}

function pedirVoz(frase, sintonia, signal) {
  return fetch('/api/voz', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, signal,
    body: JSON.stringify({ personaje: actual.id, texto: frase, sintonia })
  }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); });
}

function sonar(blob, signal) {
  return new Promise((resolver, rechazar) => {
    const url = URL.createObjectURL(blob);
    const a = new Audio(url);
    vozAudio = a;
    const limpiar = () => { URL.revokeObjectURL(url); if (vozAudio === a) vozAudio = null; };
    // Un fallo de una frase no debe tumbar el resto de la respuesta.
    a.onended = () => { limpiar(); resolver(); };
    a.onerror = () => { limpiar(); resolver(); };
    signal.addEventListener('abort', () => {
      a.pause(); limpiar(); rechazar(new DOMException('cortado', 'AbortError'));
    }, { once: true });
    a.play().catch(() => { limpiar(); resolver(); });
  });
}

// La red: síntesis del NAVEGADOR. Instantánea y gratis, pero suena a locutor.
function hablarNavegador(texto) {
  if (!('speechSynthesis' in window)) return modoParar(false);
  const u = new SpeechSynthesisUtterance(texto);
  const v = vozEspanol();
  if (v) u.voice = v;
  u.lang = (v && v.lang) || 'es-ES';
  // pitch/rate por personaje: diferencian el timbre (vienen del registro)
  u.pitch = (actual && actual.voz_pitch) || 1.0;
  u.rate  = (actual && actual.voz_rate)  || 1.0;
  // Se comprueba la identidad porque una locución CANCELADA también dispara
  // onend, y esa no debe apagar el turno que viene detrás.
  u.onend = u.onerror = () => { if (u === vozActual) modoParar(false); };
  vozActual = u;
  speechSynthesis.speak(u);
}

// Hacerle callar. Importante antes de escuchar: si el altavoz sigue sonando,
// el micrófono recoge al personaje y acabaría conversando consigo mismo.
function callar() {
  vozActual = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (vozAbort) { vozAbort.abort(); vozAbort = null; }
  if (vozAudio) { vozAudio.pause(); vozAudio = null; }
  vozSonando = false;
}
function hablando() {
  return vozSonando
      || ('speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending));
}

// --- OÍDO: hablarle en vez de escribirle ---------------------------------
// Reconocimiento de voz del NAVEGADOR (Web Speech API), la pieza gemela de
// hablar(): sin servidor, sin claves, sin descargas. Chrome y Edge lo tienen;
// Firefox todavía no, y allí el botón simplemente desaparece.
// Requiere HTTPS (o localhost) para que el navegador dé acceso al micrófono.
//
// QUÉ MICRÓFONO USA: el predeterminado del sistema, y no hay manera de decirle
// otro — la Web Speech API no acepta deviceId, a diferencia de getUserMedia. En
// la sala el bueno es el de la webcam USB (está donde el visitante; el del
// portátil, a un metro y mirando a otro lado), así que hay que ponerlo como
// predeterminado en Windows › Sonido › Entrada. web/presencia.js lo comprueba al
// arrancar y avisa en el rótulo si está puesto el otro.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const PLACEHOLDER = $inp.placeholder;
let rec = null, oyendo = false, dictado = '';

if (!SR) {
  $mic.remove();          // sin soporte: se sigue escribiendo, como siempre
} else {
  rec = new SR();
  rec.lang = 'es-ES';
  rec.continuous = false;      // una intervención por pulsación: el navegador
                               // corta solo al detectar que has terminado
  rec.interimResults = true;   // ir viendo lo que entiende mientras hablas

  rec.onstart = () => {
    oyendo = true;
    $mic.classList.add('oyendo');
    $mic.title = 'Escuchando… pulsa para terminar';
    $inp.placeholder = 'Escuchando…';
  };

  rec.onresult = e => {
    // Lo ya cerrado se acumula en 'dictado'; lo provisional solo se muestra,
    // porque el navegador aún puede corregirlo.
    let parcial = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) dictado += r[0].transcript; else parcial += r[0].transcript;
    }
    $inp.value = (dictado + parcial).trim();
  };

  rec.onerror = e => {
    const motivos = {
      'not-allowed': 'Sin permiso de micrófono: actívalo en el navegador.',
      'service-not-allowed': 'Sin permiso de micrófono: actívalo en el navegador.',
      'no-speech': 'No se oyó nada. Pulsa el micrófono y habla.',
      'audio-capture': 'No se encontró ningún micrófono.',
      'network': 'El reconocimiento necesita conexión. Escribe si prefieres.',
    };
    if (e.error !== 'aborted') $inp.placeholder = motivos[e.error]
      || ('El micrófono falló (' + e.error + '). Escribe si prefieres.');
  };

  rec.onend = () => {
    oyendo = false;
    $mic.classList.remove('oyendo');
    $mic.title = 'Habla en vez de escribir';
    if ($inp.placeholder === 'Escuchando…') $inp.placeholder = PLACEHOLDER;
    // Si entendió algo, se envía solo: obligar a pulsar un botón después de
    // hablar rompe la ilusión de estar conversando con alguien.
    const dicho = dictado.trim();
    dictado = '';
    if (dicho) { $inp.value = dicho; enviar(); }
  };

  $mic.onclick = () => { oyendo ? rec.stop() : escuchar(); };
}

// --- «PARA» — cortar una respuesta demasiado larga ----------------------
// Mientras el personaje habla, el micrófono de dictado está cerrado (si no,
// se oiría a sí mismo). Así que la orden de parar la escucha un SEGUNDO
// reconocedor, que solo vive durante el turno y solo busca estas palabras.
const PALABRAS_PARAR = ['para', 'pare'];   // añade aquí 'basta', 'stop'…

let pararTurno = null;      // lo pone enviar(); null = no hay nada que cortar
let vigia = null, vigilando = false;

/** ¿Lo que se oyó ES la orden, o solo la contiene? */
function esOrdenDeParar(texto) {
  // Sin acentos que valgan: 'para' y 'pare' no los llevan, asi que basta
  // con bajar a minusculas y dejar solo letras y espacios.
  const limpio = texto.toLowerCase().replace(/[^a-z ]/g, ' ').trim();
  const palabras = limpio.split(/\s+/).filter(Boolean);
  // Solo cuenta si la orden es TODO lo dicho. En español "para" aparece a cada
  // paso ("para ti", "para que"), y el propio personaje lo dirá por el altavoz.
  // Exigiendo que la frase entera sea la orden, esas apariciones no disparan.
  return palabras.length > 0 && palabras.length <= 2
      && palabras.every(p => PALABRAS_PARAR.includes(p));
}

function vigilar(si) {
  if (!SR) return;
  if (si) {
    if (vigilando) return;
    if (!vigia) {
      vigia = new SR();
      vigia.lang = 'es-ES';
      vigia.continuous = true;
      // Solo resultados FINALES. Con los provisionales bastaría con que el
      // personaje empezara una frase por "Para…" para cortarse a sí mismo.
      // Cuesta cerca de un segundo de reacción y evita ese ridículo.
      vigia.interimResults = false;
      vigia.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (esOrdenDeParar(e.results[i][0].transcript)) { parar(); return; }
        }
      };
      vigia.onerror = () => {};
      // El reconocedor se corta solo cada pocos segundos: se relanza mientras
      // siga habiendo algo que vigilar.
      vigia.onend = () => { if (vigilando) { try { vigia.start(); } catch (e) {} } };
    }
    vigilando = true;
    try { vigia.start(); } catch (e) {}
  } else {
    vigilando = false;
    if (vigia) { try { vigia.abort(); } catch (e) {} }
  }
}

/** Muestra el botón de parar y pone el oído, o lo retira todo. */
function modoParar(si) {
  $parar.hidden = !si;
  vigilar(si);
}

/** Cortar: primero el altavoz (instantáneo), luego la generación. */
function parar() {
  callar();
  if (pararTurno) pararTurno();
  modoParar(false);
}

$parar.onclick = parar;

// Abrir el micrófono. La usan el botón 🎤 y, sola, la detección de presencia.
function escuchar() {
  if (!rec || oyendo || $mic.disabled) return false;
  vigilar(false);   // los dos reconocedores no pueden compartir el micrófono
  callar();
  dictado = ''; $inp.value = ''; $inp.placeholder = PLACEHOLDER;
  try { rec.start(); } catch (e) { return false; }  // ya arrancando: ignorar
  return true;
}
// Cerrar el micrófono TIRANDO lo oído (a diferencia de stop(), que lo envía).
function cortarEscucha() {
  if (!rec || !oyendo) return;
  dictado = ''; $inp.value = '';
  rec.abort();
}

// --- Contrato con el módulo de presencia (web/presencia.js) --------------
// Lo que la webcam puede pedirle a la sala, y nada más. Presencia no toca el
// chat por dentro: si mañana se cambia la interfaz, solo se revisa esta lista.
window.Sala = {
  actual:   () => actual && actual.id,
  ids:      () => personajes.map(p => p.id),
  elegir:   (id, discreto) => {
    const p = personajes.find(x => x.id === id);
    if (p) elegir(p, discreto);
    return !!p;
  },
  nombre:   id => { const p = personajes.find(x => x.id === id); return p ? p.nombre : id; },
  listos:   () => personajes.length > 0,
  ocupado:  () => generando || oyendo || hablando(),
  generando: () => generando,
  // Saluda en voz alta: es la invitación cuando alguien se acerca de verdad.
  saludar:  () => { if (actual && actual.saludo) hablar(actual.saludo); },
  oyendo:   () => oyendo,
  hablando,
  hayMicro: () => !!rec,
  escuchar,
  cortarEscucha,
  callar,
  parar,     // corta generación Y voz: lo usa la presencia si el visitante se va
  recitar,   // el poema al transeúnte: personaje al azar, sin archivar
};

$btn.onclick = enviar;
$inp.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
</script>
<!-- La webcam: quién se acerca y hacia dónde mira. Habla con la sala solo a
     través de window.Sala, definido justo arriba. -->
<script type="module" src="/web/presencia.js"></script>
</body>
